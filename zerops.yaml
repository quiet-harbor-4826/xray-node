zerops:
  - setup: xray
    build:
      base: alpine@latest
      buildCommands:
        - apk add --no-cache curl unzip ca-certificates
        - curl -L -o /tmp/xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
        - unzip /tmp/xray.zip -d ./bin/
        - chmod +x ./bin/xray
      deployFiles:
        - bin/xray
        - config.json
        - start.sh
    run:
      base: alpine/docker@26.1.5
      start: /bin/sh /var/www/start.sh
      ports:
        - port: 8080
          httpSupport: true
